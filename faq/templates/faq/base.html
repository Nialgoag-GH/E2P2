{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <meta name="description" content="VideoGames News - Noticias, novedades y actualidad del mundo de los videojuegos." />
    <meta name="author" content="VideoGames News" />

    <title>VideoGames News</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link href="{% static 'core/css/styles.css' %}" rel="stylesheet" />
</head>

<body id="page-top" class="d-flex flex-column h-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
        <div class="container px-4 px-lg-5">

            <a class="navbar-brand" href="index.html">
                VideoGames News
            </a>

            <button class="navbar-toggler" 
                    type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#navbarResponsive"
                    aria-controls="navbarResponsive" 
                    aria-expanded="false" 
                    aria-label="Toggle navigation">
                <i class="bi bi-list"></i>
            </button>

            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/noticias">Noticias</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/faq">FAQ</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- FOOTER -->
    <footer class="footer bg-black small text-center text-white-50">

        <div class="container px-4 px-lg-5">

            <div class="mb-3">
                <strong>VideoGames News</strong>
            </div>

            <div class="mb-3">
                Noticias y actualidad del mundo de los videojuegos.
            </div>

            <div>
                &copy; 2026 VideoGames News. Todos los derechos reservados.
            </div>

        </div>

    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="{% static 'core/js/scripts.js' %}"></script>

</body>
</html>
