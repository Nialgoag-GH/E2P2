{% extends "core/base.html" %}
{% load static %}
{%block content%}

    <h2 class="text-white">
        Categoría: {{ category }}
    </h2>

    {% for noticia in category.news_set.all %}
    
    <div class="row g-4">
        <div class="col-lg-3 col-md-6 news-item">
            
            <article class="news-card">

                <img src="{{ noticia.image.url }}" alt="{{ noticia.title }}" loading="lazy"> 
                <div class="news-card-body">
                    <h3 class="text-white">{{ noticia.title }}</h3>
                    <p class="news-date">{{ noticia.created|date:"d/m/Y" }}</p>
                    <p class="text-white">{{ noticia.detail }}</p>
                </div>
            </article>
            
        </div>
    </div>

    {% endfor %}

    
{% endblock %}
